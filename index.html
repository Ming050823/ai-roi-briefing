<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UBS Evidence Lab｜企業 AI 落地落差、六大障礙與 ROI 量測</title>
  <style>html,body{margin:0;background:#f6f3ec;color:#12202c;font-family:Georgia,serif}.boot{padding:48px 24px;text-align:center;line-height:1.7}</style>
</head>
<body>
  <p class="boot" id="boot">載入簡報中… Loading briefing…</p>
  <script>
  (async () => {
    const urls = ['data/0.txt','data/1.txt','data/2.txt','data/3.txt'];
    const parts = await Promise.all(urls.map(u => fetch(u).then(r => {
      if (!r.ok) throw new Error(u + ' ' + r.status);
      return r.text();
    })));
    const b64 = parts.join('').replace(/\s+/g,'');
    const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const html = await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open();
    document.write(html);
    document.close();
  })().catch(err => {
    document.getElementById('boot').innerHTML =
      '簡報正在補上傳。Briefing files are still uploading.<br><small>' + err + '</small>';
  });
  </script>
</body>
</html>
